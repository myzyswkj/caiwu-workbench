# 部署纯静态站到 GitHub Pages（GitHub Actions 方式）
# 背景：经典 legacy 构建器连续失败（"Page build failed"），改用官方 Actions 部署，可靠且可观测。
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # 允许在 Actions 页面手动触发重建

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
