<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财务工作台</title>
  <link rel="stylesheet" href="css/style.css?v=36" />
  <!-- PWA：可添加到手机/桌面主屏，像 App 一样使用 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0B1A2E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="财务工作台" />
</head>
<body>
  <div class="app">
    <!-- ===== 左侧栏目 ===== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">财</div>
        <div class="brand-text">
          <div class="brand-title">财务工作台</div>
          <div class="brand-sub" id="brandDate"></div>
        </div>
      </div>

      <!-- 模块导航 -->
      <nav class="nav" id="moduleNav">
        <button class="nav-item active" data-module="home"><span class="nav-ico">🏠</span>工作台首页</button>
        <button class="nav-item" data-module="internal"><span class="nav-ico">📒</span>登记内账</button>
        <button class="nav-item" data-module="tax"><span class="nav-ico">🧾</span>报税记账</button>
        <button class="nav-item" data-module="contacts"><span class="nav-ico">🤝</span>往来账</button>
        <button class="nav-item" data-module="memo"><span class="nav-ico">📝</span>备忘录</button>
        <div class="nav-group" id="navGroupTools">
          <button class="nav-group-head" id="navGroupToolsHead"><span class="nav-ico">📋</span>知识工具<span class="nav-arrow">▸</span></button>
          <div class="nav-group-body" hidden>
            <button class="nav-item nav-child" data-module="taxcalc"><span class="nav-ico">💡</span>税负测算</button>
            <button class="nav-item nav-child" data-module="taxburden"><span class="nav-ico">📊</span>税负率计算</button>
            <button class="nav-item nav-child" data-module="sme2gen"><span class="nav-ico">🚦</span>升一般纳税人预警</button>
            <button class="nav-item nav-child" data-module="stamptax"><span class="nav-ico">💰</span>印花税计算</button>
            <button class="nav-item nav-child" data-module="disabilityfund"><span class="nav-ico">♿</span>残保金测算</button>
            <button class="nav-item nav-child" data-module="iitwithhold"><span class="nav-ico">🧾</span>个税累计预扣表</button>
            <button class="nav-item nav-child" data-module="taxkb"><span class="nav-ico">📚</span>财税知识</button>
            <button class="nav-item nav-child" data-module="fnkb"><span class="nav-ico">🧮</span>公式函数知识</button>
          </div>
        </div>
        <button class="nav-item" data-module="invoices"><span class="nav-ico">🧾</span>发票台账</button>
        <button class="nav-item" data-module="salary"><span class="nav-ico">💰</span>工资登记</button>
        <button class="nav-item" data-module="projectCost"><span class="nav-ico">📈</span>项目核算</button>
        <button class="nav-item" data-module="version"><span class="nav-ico">🗂</span>版本与备份</button>
      </nav>

      <!-- 常用网站 -->
      <div class="sites">
        <div class="sites-head">
          <span>常用网站</span>
          <button class="icon-btn" id="addSiteBtn" title="添加常用网站">＋</button>
        </div>
        <ul class="site-list" id="siteList"></ul>
      </div>

      <div class="sidebar-foot">
        <button class="ghost-btn" id="exportBtn" title="导出全部数据（含照片凭证）">⬇ 导出数据</button>
        <button class="ghost-btn" id="importBtn" title="导入数据（含照片凭证）">⬆ 导入数据</button>
        <button class="ghost-btn" id="cryptoBtn" title="本地加密 / 锁定">🔒 加密</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </aside>

    <!-- ===== 主内容区 ===== -->
    <main class="main">
      <header class="topbar">
        <div class="ledger-switch">
          <button class="ls-current" id="lsCurrent">📚 默认账本 ▾</button>
          <div class="ls-menu" id="lsMenu" hidden></div>
        </div>
        <div class="topbar-title" id="topTitle">工作台首页</div>
        <div class="topbar-actions" id="topActions"></div>
        <div class="auth-area" id="authArea"></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <!-- 加密解锁覆盖层 -->
  <div class="lock-overlay" id="lockOverlay" hidden></div>

  <!-- 通用弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" id="modal">
      <div class="modal-head">
        <span id="modalTitle">标题</span>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- Supabase SDK（已本地化，避免国内 CDN 被墙导致云同步失效） -->
  <script src="js/supabase.js"></script>

  <!-- 本地 GBK/UTF-8 解码库（已本地化，所有浏览器含 iPhone Safari 一致可用） -->
  <script src="js/iconv-lite.js"></script>
  <script src="js/xlsx.full.min.js"></script>
  <!-- 向 SheetJS 输出的 xlsx 注入凭证图片（社区版本身不支持写图） -->
  <script src="js/xlsx_pic.js"></script>
  <!-- 把流水明细手绘成 PNG 图片导出（原生 Canvas，无第三方依赖） -->
  <script src="js/table_image.js?v=36"></script>

  <!-- 本地核心脚本（不依赖外部 CDN，保证离线可用） -->
  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <!-- 合同文档解析：PDF(pdf.js) / Word(mammoth)，本地 vendor，离线可用 -->
  <script src="js/vendor/pdf.min.js"></script>
  <script src="js/vendor/mammoth.browser.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/catmatch.js"></script>
  <script src="js/internal.js?v=36"></script>
  <script src="js/tax.js"></script>
  <script src="js/memo.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/contacts.js"></script>
  <script src="js/taxcalc.js"></script>
  <script src="js/taxburden.js"></script>
  <script src="js/sme_gen.js"></script>
  <script src="js/stamptax.js"></script>
  <script src="js/disabilityfund.js"></script>
  <script src="js/iitwithhold.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/salary.js?v=36"></script>
  <script src="js/project_cost.js?v=36"></script>
  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/main.js"></script>

  <!-- PWA：注册 Service Worker，支持离线打开 / 添加到主屏 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service Worker 注册失败：', e);
        });
      });
    }
  </script>

  <!-- 说明：Supabase SDK 已本地化为 js/supabase.js（见上方），不再依赖外部 CDN -->
</body>
</html>
